{% extends 'base.html' %}

{% block title %}Blogs{% endblock title %}
{% block extra_head %}
<style>

    .blog-container {
    width: 80%;
    margin: 2rem auto;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.blog-heading {
    font-size: 2.2rem;
    font-weight: bold;
    margin-bottom: 2rem;
}

.blog-item {
    padding: 1rem;
    border-bottom: 1px solid #ddd;
    margin-bottom: 1rem;
}

.blog-item h2 {
    font-size: 1.5rem;
    font-weight: 700;
}

.snippet {
    color: #333;
    line-height: 1.6;
    margin: 0.5rem 0;
}

.read-more-btn {
    background-color: #2196F3;
    color: white;
    border: none;
    padding: 0.5rem 1.2rem;
    border-radius: 10px;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

.read-more-btn:hover {
    background-color: #0b7dda;
}

</style>
{% endblock extra_head %}
{% block body %}
<div class="blog-container">
    <h1 class="blog-heading">Blogs by Lakshay Jindal</h1>
    {% for blog in blogs %}
        <div class="blog-item">
            <h2>{{ blog.title }}</h2>
            <p class="snippet">{{ blog.content|truncatechars:200 }}</p>
            <a href="{% url 'blog_detail' blog.id %}">
                <button class="read-more-btn">Read More</button>
            </a>
        </div>
    {% endfor %}
</div>
{% endblock body %}
