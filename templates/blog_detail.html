{% extends 'base.html' %}

{% block title %}{{ blog.title }}{% endblock title %}
{% block extra_head %}
<style>

    .single-blog {
    width: 80%;
    margin: auto;
    padding: 3rem 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.single-blog h1 {
    font-size: 2rem;
    margin-bottom: 1rem;
}

.blog-content {
    line-height: 1.8;
    font-size: 1.1rem;
    color: #222;
}

</style>

{% endblock extra_head %}
{% block body %}
<div class="single-blog">
    <h1>{{ blog.title }}</h1>
    <p class="blog-content">{{ blog.content }}</p>
</div>
{% endblock body %}
