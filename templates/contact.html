{% extends 'base.html' %} {% block title %}Contact Us{% endblock title %} {%
block body %}

<div class="contactform">
  <h1>Contact me For work / General Enquiries</h1>
  <form method="post" action="contact.html">
    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">Email address</label>
      <input
        type="email"
        class="form-control"
        id="clientemail"
        aria-describedby="emailHelp"
      />
      <div id="emailHelp" class="form-text">
        We'll never share your email and Phone with anyone else.
      </div>
    </div>
    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">Name</label>
      <input
        type="name"
        class="form-control"
        id="clientname"
        aria-describedby="emailHelp"
      />
    </div>
    <div class="mb-3">
      <label for="clientphone" class="form-label">Phone Number</label>
      <input type="phone" class="form-control" id="phone" />
    </div>
    <div class="mb-3" id="form-check">
      <input type="checkbox" class="form-check-input" id="isclient" />
      <label class="form-check-label" for="isclient"
        >I want you to work on a project with me</label
      >
    </div>
    <button type="submit" class="btn-sm btn-primary" id="submit">Submit</button>
  </form>
</div>
{% endblock body %}
